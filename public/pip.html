<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>深度学习 · 画中画</title>
<meta name="application-name" content="深度学习">
<meta name="theme-color" content="#0d1117">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script>try{const t=localStorage.getItem('stock_theme_v1')||'dark';document.documentElement.dataset.theme=t==='system'?(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'):t}catch(_){}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0d1117;color:#e6edf3;padding:20px}
.controls{margin-bottom:16px;display:flex;gap:8px;align-items:center}.brand{display:flex;align-items:center;gap:7px;margin-right:6px;font-size:14px;font-weight:650}.brand img{width:24px;height:24px;border-radius:6px}
button{background:#238636;border:none;border-radius:6px;color:#fff;padding:8px 16px;font-size:14px;cursor:pointer}
button:hover{background:#2ea043}
button:disabled{opacity:.4;cursor:not-allowed}
#canvas-container{position:relative;background:#161b22;border:1px solid #30363d;border-radius:8px;overflow:hidden}
canvas{display:block;width:100%}
.status{font-size:13px;color:#8b949e;margin-left:auto}
html[data-theme="light"]{color-scheme:light}html[data-theme="light"] body{background:#f3f6fa;color:#172033}html[data-theme="light"] #canvas-container{background:#fff;border-color:#d7e0ea;box-shadow:0 3px 14px #1f3b5b0d}html[data-theme="light"] .status{color:#57606a}
</style>
</head>
<body>
<div class="controls">
  <div class="brand"><img src="/favicon.svg" alt="">深度学习</div>
  <button id="start-btn" onclick="startPiP()">启动画中画</button>
  <button id="stop-btn" onclick="stopPiP()" disabled>停止画中画</button>
  <div class="status" id="status">未启动</div>
</div>
<div id="canvas-container">
  <canvas id="canvas" width="640" height="360"></canvas>
</div>

<script>
const STORAGE_KEY = 'watchlist_v1';
const GROUPS_STORAGE_KEY = 'watchlist_groups_v1';
const ACTIVE_GROUP_STORAGE_KEY = 'watchlist_active_group_v1';
const COLOR_STORAGE_KEY = 'stock_list_colors_v1';
const THEME_STORAGE_KEY = 'stock_theme_v1';
const DEFAULT_STOCKS = ['sh600519','sz000001','hk00700','usAAPL'];
const _stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
const _valid = Array.isArray(_stored) ? _stored.filter(s => /^[a-zA-Z0-9._]+$/.test(s)) : [];
function loadActiveWatchlist() {
  try {
    const groups = JSON.parse(localStorage.getItem(GROUPS_STORAGE_KEY) || 'null');
    const activeId = localStorage.getItem(ACTIVE_GROUP_STORAGE_KEY);
    const active = Array.isArray(groups) && groups.find(group => group.id === activeId);
    if (active && Array.isArray(active.stocks)) return active.stocks.filter(s => /^[a-zA-Z0-9._-]+$/.test(s));
  } catch (_) {}
  return _valid.length ? _valid : [...DEFAULT_STOCKS];
}
let watchlist = loadActiveWatchlist();
let showListColors = localStorage.getItem(COLOR_STORAGE_KEY) !== 'false';
const systemThemeQuery = matchMedia('(prefers-color-scheme: light)');
let themePreference = ['light','dark','system'].includes(localStorage.getItem(THEME_STORAGE_KEY)) ? localStorage.getItem(THEME_STORAGE_KEY) : 'dark';
function resolvedTheme() { return themePreference === 'system' ? (systemThemeQuery.matches ? 'light' : 'dark') : themePreference; }
function applyTheme() { document.documentElement.dataset.theme = resolvedTheme(); fetchAndRender(); }
function pipColor(dark, light) { return resolvedTheme() === 'light' ? light : dark; }
systemThemeQuery.addEventListener?.('change', () => { if (themePreference === 'system') applyTheme(); });

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let stream = null;
let video = null;
let pipWindow = null;
let refreshTimer = null;

function marketLabel(sym) {
  if (sym.startsWith('sh') || sym.startsWith('sz')) return 'A';
  if (sym.startsWith('hk')) return '港';
  if (sym.startsWith('us')) return '美';
  return '';
}

function fmt(n, d=2) { const v=parseFloat(n); return (isNaN(v)||v===0)?'--':v.toFixed(d); }
function cls(n) {
  if (!showListColors) return pipColor('#e6edf3','#1f2328');
  const v=parseFloat(n);
  if(isNaN(v)||v===0)return pipColor('#8b949e','#57606a');
  return v>0?'#f85149':'#3fb950';
}
function sign(n) { return parseFloat(n)>0?'+':''; }

function parseQuoteText(text) {
  const result = {};
  for (const line of text.split('\n')) {
    const m = line.match(/^v_(\w+)="([^"]*)"/);
    if (m) result[m[1]] = m[2].split('~');
  }
  return result;
}

function extractQuote(sym, fields) {
  if (!fields || fields.length < 10) return null;
  return {
    name: fields[1], price: fields[3], chg: fields[31], pct: fields[32],
  };
}

async function fetchAndRender() {
  if (!watchlist.length) return;
  try {
    const resp = await fetch(`/api/quote?symbols=${encodeURIComponent(watchlist.join(','))}`);
    if (!resp.ok) throw new Error();
    const data = parseQuoteText(await resp.text());
    renderCanvas(data);
  } catch(e) {
    console.error('fetch error:', e);
  }
}

function renderCanvas(data) {
  const W = 640, H = 360;
  ctx.fillStyle = pipColor('#0d1117','#ffffff');
  ctx.fillRect(0, 0, W, H);

  // title
  ctx.fillStyle = pipColor('#e6edf3','#1f2328');
  ctx.font = 'bold 20px sans-serif';
  ctx.fillText('深度学习 · 自选股行情', 20, 35);

  // time
  ctx.font = '12px monospace';
  ctx.fillStyle = pipColor('#8b949e','#57606a');
  ctx.fillText(new Date().toLocaleTimeString('zh-CN'), W - 90, 35);

  // table header
  const rowH = 40;
  const startY = 60;
  ctx.fillStyle = pipColor('#1c2128','#f0f3f6');
  ctx.fillRect(0, startY, W, rowH);

  ctx.fillStyle = pipColor('#8b949e','#57606a');
  ctx.font = 'bold 13px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('代码', 20, startY + 25);
  ctx.fillText('名称', 120, startY + 25);
  ctx.fillText('最新价', 280, startY + 25);
  ctx.fillText('涨跌额', 380, startY + 25);
  ctx.fillText('涨跌幅', 490, startY + 25);

  // rows
  watchlist.forEach((sym, i) => {
    const y = startY + rowH * (i + 1);
    if (y > H - 10) return; // out of bounds

    const q = extractQuote(sym, data[sym]);
    if (!q) {
      ctx.fillStyle = pipColor('#6e7681','#6e7781');
      ctx.font = '13px sans-serif';
      ctx.fillText('加载中...', 20, y + 25);
      return;
    }

    // market + code
    const mkt = marketLabel(sym);
    const code = sym.replace(/^(sh|sz|hk|us)/, '');
    ctx.fillStyle = pipColor('#58a6ff','#0969da');
    ctx.font = '11px sans-serif';
    ctx.fillText(mkt, 20, y + 25);
    ctx.fillStyle = pipColor('#e6edf3','#1f2328');
    ctx.font = 'bold 13px monospace';
    ctx.fillText(code, 40, y + 25);

    // name
    ctx.fillStyle = pipColor('#e6edf3','#1f2328');
    ctx.font = '13px sans-serif';
    ctx.fillText(q.name.slice(0, 8), 120, y + 25);

    // price
    const color = cls(q.chg);
    ctx.fillStyle = color;
    ctx.font = 'bold 14px monospace';
    ctx.fillText(fmt(q.price), 280, y + 25);

    // chg
    ctx.fillText(sign(q.chg) + fmt(q.chg), 380, y + 25);

    // pct
    ctx.fillText(sign(q.pct) + fmt(q.pct) + '%', 490, y + 25);
  });
}

async function startPiP() {
  if (!document.pictureInPictureEnabled) {
    alert('当前浏览器不支持画中画功能');
    return;
  }

  try {
    // first fetch and render data
    await fetchAndRender();

    // capture canvas stream
    stream = canvas.captureStream(30); // higher fps for smoother updates

    // create hidden video
    video = document.createElement('video');
    video.muted = true;
    video.style.display = 'none';
    document.body.appendChild(video);

    video.srcObject = stream;

    // play the video first
    await video.play();

    // small delay to ensure video is truly ready
    await new Promise(resolve => setTimeout(resolve, 100));

    // request PiP
    pipWindow = await video.requestPictureInPicture();

    document.getElementById('start-btn').disabled = true;
    document.getElementById('stop-btn').disabled = false;
    document.getElementById('status').textContent = '画中画运行中';

    // refresh data every 5s
    refreshTimer = setInterval(fetchAndRender, 5000);
    // fetchAndRender already called before PiP started

    // handle PiP close
    pipWindow.addEventListener('resize', () => {
      console.log('PiP resized:', pipWindow.width, pipWindow.height);
    });

    video.addEventListener('leavepictureinpicture', () => {
      stopPiP();
    });

  } catch(e) {
    console.error('PiP error:', e);
    alert('启动画中画失败: ' + e.message);
    stopPiP();
  }
}

function stopPiP() {
  if (refreshTimer) clearInterval(refreshTimer);
  if (video) {
    if (document.pictureInPictureElement) {
      document.exitPictureInPicture();
    }
    video.srcObject = null;
    video.remove();
    video = null;
  }
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }
  pipWindow = null;

  document.getElementById('start-btn').disabled = false;
  document.getElementById('stop-btn').disabled = true;
  document.getElementById('status').textContent = '已停止';
}

window.addEventListener('storage', event => {
  if (event.key === THEME_STORAGE_KEY) { themePreference = ['light','dark','system'].includes(event.newValue) ? event.newValue : 'dark'; applyTheme(); return; }
  if (event.key === COLOR_STORAGE_KEY) showListColors = event.newValue !== 'false';
  else if ([GROUPS_STORAGE_KEY, ACTIVE_GROUP_STORAGE_KEY, STORAGE_KEY].includes(event.key)) watchlist = loadActiveWatchlist();
  else return;
  fetchAndRender();
});

// initial render
applyTheme();
</script>
</body>
</html>
