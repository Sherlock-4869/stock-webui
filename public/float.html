<html lang="zh-CN">
<head>

<meta name="application-name" content="深度学习">

<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script>try{const t=localStorage.getItem('stock_theme_v1')||'dark';const r=t==='system'?(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'):t;document.documentElement.dataset.theme=['light','paper'].includes(r)?'light':'dark';document.documentElement.dataset.themeSkin=r}catch(_){}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark;--fl-bg:#090a0d;--fl-surface:#111318;--fl-surface-2:#161920;--fl-hover:#1b1f27;--fl-border:rgba(255,255,255,.07);--fl-border-strong:rgba(255,255,255,.13);--fl-text:#f2f4f7;--fl-text-sec:#b8c0cc;--fl-muted:#788191;--fl-accent:#3b82f6;--fl-accent-bright:#60a5fa;--fl-accent-soft:rgba(59,130,246,.13)}
html[data-theme="light"]{color-scheme:light;--fl-bg:#f5f6f8;--fl-surface:#ffffff;--fl-surface-2:#f9fafb;--fl-hover:#eef1f5;--fl-border:rgba(15,23,42,.075);--fl-border-strong:rgba(15,23,42,.13);--fl-text:#111827;--fl-text-sec:#374151;--fl-muted:#6b7280;--fl-accent:#2563eb;--fl-accent-bright:#1d4ed8;--fl-accent-soft:rgba(37,99,235,.085)}
html[data-theme-skin="paper"]{--fl-bg:#f4efe6;--fl-surface:#fcfaf5;--fl-surface-2:#f6f1e8;--fl-hover:#e8e0d2;--fl-border:rgba(88,66,42,.105);--fl-border-strong:rgba(88,66,42,.18);--fl-text:#29211a;--fl-text-sec:#524336;--fl-muted:#7e6b5b;--fl-accent:#a65729;--fl-accent-bright:#8c451c;--fl-accent-soft:rgba(166,87,41,.1)}
html[data-theme-skin="ocean"]{--fl-bg:#060d14;--fl-surface:#0c1723;--fl-surface-2:#101f2f;--fl-hover:#15283c;--fl-border:rgba(135,206,238,.1);--fl-border-strong:rgba(135,206,238,.18);--fl-text:#eaf4fa;--fl-text-sec:#b5ccdc;--fl-muted:#7898ae;--fl-accent:#1d92bc;--fl-accent-bright:#48bfe8;--fl-accent-soft:rgba(56,182,224,.13)}
html[data-theme-skin="forest"]{--fl-bg:#070f0c;--fl-surface:#0d1a15;--fl-surface-2:#12231d;--fl-hover:#172d25;--fl-border:rgba(126,208,168,.1);--fl-border-strong:rgba(126,208,168,.18);--fl-text:#ebf5f0;--fl-text-sec:#b7cfc3;--fl-muted:#7c9d8d;--fl-accent:#2c9668;--fl-accent-bright:#55c08d;--fl-accent-soft:rgba(85,192,141,.13)}
html[data-theme-skin="violet"]{--fl-bg:#0b0911;--fl-surface:#151120;--fl-surface-2:#1c162b;--fl-hover:#231c36;--fl-border:rgba(190,166,248,.105);--fl-border-strong:rgba(190,166,248,.19);--fl-text:#f3effa;--fl-text-sec:#cbc0df;--fl-muted:#9082ac;--fl-accent:#8257e6;--fl-accent-bright:#af8eff;--fl-accent-soft:rgba(175,142,255,.13)}
body{min-width:360px;height:100vh;overflow:hidden;background:var(--fl-bg);color:var(--fl-text);font-family:"Inter",-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}.float-app{display:flex;width:100%;max-width:1100px;height:100%;margin:0 auto;flex-direction:column;padding:12px;gap:10px}.float-head{display:flex;align-items:center;gap:9px;min-height:38px}.brand{display:flex;align-items:center;min-width:0;gap:9px;flex:1}.brand img{width:28px;height:28px;border-radius:8px;box-shadow:none}.brand-copy{min-width:0}.brand-title{overflow:hidden;font-size:13.5px;font-weight:740;text-overflow:ellipsis;white-space:nowrap}.brand-group{display:block;overflow:hidden;margin-top:2px;color:var(--fl-muted);font-size:11px;text-overflow:ellipsis;white-space:nowrap}.float-icon-btn{display:grid;place-items:center;width:32px;height:32px;border:1px solid var(--fl-border-strong);border-radius:8px;background:var(--fl-surface);color:var(--fl-accent-bright);font-size:15px;cursor:pointer;transition:.15s}.float-icon-btn:hover{border-color:var(--fl-accent-bright);background:var(--fl-accent-soft);color:var(--fl-text)}.float-icon-btn:disabled{opacity:.55;cursor:wait}.float-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.summary-card{min-width:0;padding:9px 10px;border:1px solid var(--fl-border);border-radius:10px;background:var(--fl-surface)}.summary-label{overflow:hidden;color:var(--fl-muted);font-size:10.5px;font-weight:600;text-overflow:ellipsis;white-space:nowrap}.summary-value{display:block;overflow:hidden;margin-top:4px;font:740 15px "JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;text-overflow:ellipsis;white-space:nowrap}.summary-value.leader{font-family:inherit;font-size:12px}.summary-note{display:block;overflow:hidden;margin-top:2px;color:var(--fl-muted);font-size:10px;text-overflow:ellipsis;white-space:nowrap}.up{color:#f85149}.down{color:#3fb950}html[data-theme="light"] .up{color:#dc2626}html[data-theme="light"] .down{color:#16a34a}.flat{color:var(--fl-muted)}.float-toolbar{display:flex;align-items:center;gap:8px;min-height:32px}.float-sort{display:flex;align-items:center;gap:3px;padding:3px;border:1px solid var(--fl-border-strong);border-radius:9px;background:var(--fl-surface)}.float-sort button{border:0;border-radius:6px;background:transparent;color:var(--fl-muted);padding:4px 9px;font-size:11px;font-weight:600;cursor:pointer;transition:.14s}.float-sort button:hover{color:var(--fl-text)}.float-sort button.active{background:var(--fl-accent-soft);color:var(--fl-accent-bright);font-weight:680}.float-interval{display:flex;align-items:center;gap:5px;margin-left:auto;color:var(--fl-muted);font-size:11px;white-space:nowrap}.float-interval select{appearance:none;border:1px solid var(--fl-border-strong);border-radius:7px;background:var(--fl-surface);color:var(--fl-text);padding:4px 9px;font:600 11px inherit;cursor:pointer}.quote-status{overflow:hidden;color:var(--fl-muted);font-size:11px;text-align:right;text-overflow:ellipsis;white-space:nowrap}.quote-status.offline{color:#f85149}.quote-shell{display:flex;min-height:0;flex:1;flex-direction:column;border:1px solid var(--fl-border);border-radius:11px;background:var(--fl-surface);overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.18)}.quote-table-wrap{min-height:0;overflow:auto;scrollbar-width:thin}.quote-table{width:100%;border-collapse:collapse;font-size:12px}.quote-table thead{position:sticky;z-index:1;top:0;background:var(--fl-surface-2)}.quote-table th{padding:9px 10px;color:var(--fl-muted);font-size:11px;font-weight:650;text-align:right;white-space:nowrap;border-bottom:1px solid var(--fl-border)}.quote-table th:first-child{text-align:left}.quote-table td{padding:8px 10px;border-top:1px solid var(--fl-border);text-align:right;white-space:nowrap;transition:background .12s}.quote-table tr:hover td{background:var(--fl-hover)}.quote-table td:first-child{text-align:left}.stock-open{display:flex;align-items:center;gap:7px;max-width:100%;border:0;background:transparent;color:var(--fl-text);text-align:left;cursor:pointer}.stock-open:hover .stock-name{color:var(--fl-accent-bright)}.market-tag{display:inline-grid;place-items:center;flex:none;min-width:19px;padding:2px 4px;border-radius:5px;font-size:9.5px;font-weight:750}.tag-a{background:rgba(59,130,246,.16);color:#60a5fa}.tag-hk{background:rgba(234,179,8,.16);color:#facc15}.tag-us{background:rgba(34,197,94,.16);color:#4ade80}.tag-bj{background:rgba(168,85,247,.16);color:#c084fc}html[data-theme="light"] .tag-a{color:#1d4ed8}html[data-theme="light"] .tag-hk{color:#a16207}html[data-theme="light"] .tag-us{color:#15803d}html[data-theme="light"] .tag-bj{color:#7e22ce}.stock-copy{min-width:0}.stock-name{display:block;overflow:hidden;max-width:140px;font-size:12px;font-weight:660;text-overflow:ellipsis;white-space:nowrap}.stock-code{display:block;margin-top:2px;color:var(--fl-muted);font:10px "JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace}.quote-price{font:680 12.5px "JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace}.quote-pct{font:680 11.5px "JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace}.quote-empty{padding:42px 18px;color:var(--fl-muted);font-size:12px;line-height:1.6;text-align:center}.float-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--fl-muted);font-size:10.5px}.float-foot strong{font-weight:650;color:var(--fl-text-sec)}@media(max-width:470px){body{min-width:0}.float-app{padding:8px;gap:7px}.summary-card{padding:7px 8px}.summary-value.leader{font-size:11px}.quote-table th,.quote-table td{padding-left:7px;padding-right:7px}.quote-change{display:none}.float-interval label{display:none}.stock-name{max-width:108px}}
</style>
</head>
<body>
<main class="float-app">
  <header class="float-head">
    <div class="brand"><img src="/favicon.svg" alt=""><div class="brand-copy"><div class="brand-title">自选盯盘</div><span class="brand-group" id="group-name">正在读取分组…</span></div></div>
    <button class="float-icon-btn" id="refresh-btn" type="button" onclick="manualRefresh()" aria-label="立即刷新行情" title="立即刷新行情">↻</button>
    <button class="float-icon-btn" type="button" onclick="returnToMainWindow()" aria-label="回到主界面" title="回到主界面">↗</button>
  </header>
  <section class="float-summary" aria-label="自选股概览">
    <div class="summary-card"><span class="summary-label">上涨</span><strong class="summary-value up" id="summary-up">--</strong><span class="summary-note" id="summary-flat">平 --</span></div>
    <div class="summary-card"><span class="summary-label">下跌</span><strong class="summary-value down" id="summary-down">--</strong><span class="summary-note" id="summary-count">共 -- 只</span></div>
    <div class="summary-card"><span class="summary-label">领涨</span><strong class="summary-value leader" id="summary-leader">--</strong><span class="summary-note" id="summary-leader-pct">--</span></div>
    <div class="summary-card"><span class="summary-label">领跌</span><strong class="summary-value leader" id="summary-laggard">--</strong><span class="summary-note" id="summary-laggard-pct">--</span></div>
  </section>
  <div class="float-toolbar">
    <div class="float-sort" role="group" aria-label="排序方式"><button type="button" data-sort="order" onclick="setSortMode('order')">自选顺序</button><button type="button" data-sort="pct" onclick="setSortMode('pct')">涨跌幅</button></div>
    <label class="float-interval" for="refresh-interval"><span>刷新</span><select id="refresh-interval" onchange="setRefreshInterval(this.value)"><option value="1000">1秒</option><option value="3000">3秒</option><option value="5000">5秒</option><option value="10000">10秒</option><option value="30000">30秒</option><option value="60000">60秒</option></select></label>
    <span class="quote-status" id="quote-status" aria-live="polite">正在连接…</span>
  </div>
  <section class="quote-shell" aria-label="自选股实时行情">
    <div class="quote-table-wrap"><table class="quote-table"><thead><tr><th>股票</th><th>最新价</th><th class="quote-change">涨跌额</th><th>涨跌幅</th></tr></thead><tbody id="tbody"><tr><td colspan="4" class="quote-empty">正在加载行情…</td></tr></tbody></table></div>
  </section>
  <footer class="float-foot"><span>点击股票可在主界面打开详情</span><span><strong id="updated-time">--</strong> 更新</span></footer>
</main>

<script>
const STORAGE_KEY = 'watchlist_v1';
const GROUPS_STORAGE_KEY = 'watchlist_groups_v1';
const ACTIVE_GROUP_STORAGE_KEY = 'watchlist_active_group_v1';
const COLOR_STORAGE_KEY = 'stock_list_colors_v1';
const THEME_STORAGE_KEY = 'stock_theme_v1';
const REFRESH_INTERVAL_STORAGE_KEY = 'stock_refresh_interval_v1';
const FLOAT_SORT_STORAGE_KEY = 'stock_float_sort_v1';
const DEFAULT_STOCKS = ['sh600519','sz000001','hk00700','usAAPL'];
const REFRESH_INTERVAL_OPTIONS = [1000,3000,5000,10000,30000,60000];
const THEME_PREFERENCES = ['light','paper','dark','ocean','forest','violet','system'];

let watchlist = [];
let activeGroupName = '默认分组';
let showListColors = localStorage.getItem(COLOR_STORAGE_KEY) !== 'false';
let themePreference = THEME_PREFERENCES.includes(localStorage.getItem(THEME_STORAGE_KEY)) ? localStorage.getItem(THEME_STORAGE_KEY) : 'dark';
let refreshIntervalMs = REFRESH_INTERVAL_OPTIONS.includes(Number(localStorage.getItem(REFRESH_INTERVAL_STORAGE_KEY))) ? Number(localStorage.getItem(REFRESH_INTERVAL_STORAGE_KEY)) : 5000;
let sortMode = localStorage.getItem(FLOAT_SORT_STORAGE_KEY) === 'pct' ? 'pct' : 'order';
let refreshTimer = null;
let quoteRequestPending = false;
let quoteRefreshQueued = false;
let latestRows = [];
let fundQuoteCache = {};
const fundQuoteAttemptAt = new Map();
const systemThemeQuery = matchMedia('(prefers-color-scheme: light)');

function escapeHtml(value) { return String(value).replace(/[&<>"']/g, character => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[character])); }
function validSymbol(value) { return /^(?:(?:sh|sz|hk|us)\w+(?:\.\w+)?|fund\d{6})$/i.test(value); }
function readActiveWatchlist() {
  try {
    const groups = JSON.parse(localStorage.getItem(GROUPS_STORAGE_KEY) || 'null');
    const activeId = localStorage.getItem(ACTIVE_GROUP_STORAGE_KEY);
    const active = Array.isArray(groups) && groups.find(group => group && group.id === activeId && Array.isArray(group.stocks));
    if (active) return { name:String(active.name || '当前分组').slice(0, 20), stocks:[...new Set(active.stocks.filter(validSymbol))] };
  } catch (_) {}
  try {
    const stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
    if (Array.isArray(stored)) return { name:'默认分组', stocks:[...new Set(stored.filter(validSymbol))] };
  } catch (_) {}
  return { name:'默认分组', stocks:[...DEFAULT_STOCKS] };
}
function reloadWatchlist() {
  const snapshot = readActiveWatchlist();
  activeGroupName = snapshot.name;
  watchlist = snapshot.stocks;
  document.getElementById('group-name').textContent = `${activeGroupName} · ${watchlist.length} 只自选`;
}
function resolvedTheme() { return themePreference === 'system' ? (systemThemeQuery.matches ? 'light' : 'dark') : themePreference; }
function applyTheme() { const theme = resolvedTheme(); document.documentElement.dataset.theme = ['light','paper'].includes(theme) ? 'light' : 'dark'; document.documentElement.dataset.themeSkin = theme; }
function fmt(value, digits = 2) { const number = Number(value); return Number.isFinite(number) ? number.toFixed(digits) : '--'; }
function pct(value) { const number = Number(value); return Number.isFinite(number) ? `${number > 0 ? '+' : ''}${fmt(number)}%` : '--'; }
function tone(value) { const number = Number(value); return !Number.isFinite(number) || number === 0 ? 'flat' : number > 0 ? 'up' : 'down'; }
function marketTag(symbol) { if (symbol.startsWith('fund')) return '<span class="market-tag tag-bj">基金</span>'; if (symbol.startsWith('sh') || symbol.startsWith('sz')) return '<span class="market-tag tag-a">A</span>'; if (symbol.startsWith('hk')) return '<span class="market-tag tag-hk">港</span>'; if (symbol.startsWith('us')) return '<span class="market-tag tag-us">美</span>'; if (symbol.startsWith('bj')) return '<span class="market-tag tag-bj">北</span>'; return ''; }
function parseQuoteText(text) { const result = {}; for (const line of text.split('\n')) { const match = line.match(/^v_([a-zA-Z0-9._-]+)="([^"]*)"/); if (match) result[match[1]] = match[2].split('~'); } return result; }
function extractQuote(symbol, fields) { if (!fields || fields.length < 10) return null; return { symbol, name:fields[1] || symbol, price:fields[3], change:fields[31], pct:fields[32] }; }
function resolveQuote(symbol, value) { return symbol.startsWith('fund') ? (value ? { symbol, name:value.name || symbol, price:value.price, change:value.chg, pct:value.pct } : null) : extractQuote(symbol, value); }
function sortFloatRows(rows) { const copy = [...rows]; if (sortMode !== 'pct') return copy; return copy.sort((left, right) => { const a = Number(left.quote?.pct), b = Number(right.quote?.pct); if (!Number.isFinite(a)) return 1; if (!Number.isFinite(b)) return -1; return b - a; }); }
function renderSummary(rows) {
  const quotes = rows.map(row => row.quote).filter(Boolean);
  const up = quotes.filter(quote => Number(quote.pct) > 0).length;
  const down = quotes.filter(quote => Number(quote.pct) < 0).length;
  const flat = quotes.length - up - down;
  const sorted = [...quotes].filter(quote => Number.isFinite(Number(quote.pct))).sort((left, right) => Number(right.pct) - Number(left.pct));
  const leader = sorted[0], laggard = sorted.at(-1);
  document.getElementById('summary-up').textContent = quotes.length ? up : '--';
  document.getElementById('summary-down').textContent = quotes.length ? down : '--';
  document.getElementById('summary-flat').textContent = quotes.length ? `平 ${flat}` : '平 --';
  document.getElementById('summary-count').textContent = `共 ${watchlist.length} 只`;
  document.getElementById('summary-leader').textContent = leader?.name || '--';
  document.getElementById('summary-leader').className = `summary-value leader ${tone(leader?.pct)}`;
  document.getElementById('summary-leader-pct').textContent = pct(leader?.pct);
  document.getElementById('summary-laggard').textContent = laggard?.name || '--';
  document.getElementById('summary-laggard').className = `summary-value leader ${tone(laggard?.pct)}`;
  document.getElementById('summary-laggard-pct').textContent = pct(laggard?.pct);
}
function renderRows(rows) {
  renderSummary(rows);
  const tbody = document.getElementById('tbody');
  if (!watchlist.length) { tbody.innerHTML = '<tr><td colspan="4" class="quote-empty">当前分组暂无行情</td></tr>'; return; }
  tbody.innerHTML = sortFloatRows(rows).map(({ symbol, quote }) => {
    if (!quote) return `<tr><td>${marketTag(symbol)}<span class="stock-code">${escapeHtml(symbol.replace(/^(sh|sz|hk|us|fund)/, '').toUpperCase())}</span></td><td colspan="3" class="flat">行情加载中…</td></tr>`;
    const quoteTone = showListColors ? tone(quote.pct) : '';
    return `<tr><td><button class="stock-open" type="button" onclick="openStock('${symbol}')">${marketTag(symbol)}<span class="stock-copy"><span class="stock-name">${escapeHtml(quote.name)}</span><span class="stock-code">${escapeHtml(symbol.replace(/^(sh|sz|hk|us|fund)/, '').toUpperCase())}</span></span></button></td><td class="quote-price ${quoteTone}">${fmt(quote.price)}</td><td class="quote-change ${quoteTone}">${Number(quote.change) > 0 ? '+' : ''}${fmt(quote.change)}</td><td class="quote-pct ${quoteTone}">${pct(quote.pct)}</td></tr>`;
  }).join('');
}
function setStatus(text, offline = false) { const status = document.getElementById('quote-status'); status.textContent = text; status.classList.toggle('offline', offline); }
async function fetchAndRender() {
  if (quoteRequestPending) { quoteRefreshQueued = true; return; }
  reloadWatchlist();
  if (!watchlist.length) { latestRows = []; renderRows([]); setStatus('暂无自选股'); return; }
  const symbols = [...watchlist];
  quoteRequestPending = true;
  document.getElementById('refresh-btn').disabled = true;
  try {
    const marketSymbols = symbols.filter(symbol => !symbol.startsWith('fund'));
    const fundSymbols = symbols.filter(symbol => symbol.startsWith('fund'));
    const requests = [];
    if (marketSymbols.length) requests.push(fetch(`/api/quote?symbols=${encodeURIComponent(marketSymbols.join(','))}`).then(async response => {
      if (!response.ok) throw new Error('quote request failed');
      return parseQuoteText(await response.text());
    }));
    if (fundSymbols.length) requests.push((async () => {
      const now = Date.now();
      const dueSymbols = fundSymbols.filter(symbol => now - (fundQuoteAttemptAt.get(symbol) || 0) >= 5 * 60 * 1000);
      if (!dueSymbols.length) return fundQuoteCache;
      dueSymbols.forEach(symbol => fundQuoteAttemptAt.set(symbol, now));
      const batches = [];
      for (let index=0; index<dueSymbols.length; index+=30) batches.push(dueSymbols.slice(index, index + 30));
      const payloads = await Promise.all(batches.map(async batch => {
        const response = await fetch(`/api/fund-quotes?codes=${encodeURIComponent(batch.map(symbol => symbol.slice(4)).join(','))}`);
        if (!response.ok) throw new Error('fund quote request failed');
        return response.json();
      }));
      fundQuoteCache = { ...fundQuoteCache, ...Object.assign({}, ...payloads.map(payload => payload.data || {})) };
      return fundQuoteCache;
    })());
    const settled = await Promise.allSettled(requests);
    const fulfilled = settled.filter(result => result.status === 'fulfilled');
    if (!fulfilled.length) throw settled[0]?.reason || new Error('quote request failed');
    const data = Object.assign({}, fundQuoteCache, ...fulfilled.map(result => result.value));
    latestRows = symbols.map(symbol => ({ symbol, quote:resolveQuote(symbol, data[symbol]) }));
    renderRows(latestRows);
    const now = new Date().toLocaleTimeString('zh-CN', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
    document.getElementById('updated-time').textContent = now;
    setStatus(`已更新 ${now}`);
  } catch (error) {
    console.error('float quote error:', error);
    if (!latestRows.length) renderRows(watchlist.map(symbol => ({ symbol, quote:null })));
    setStatus('行情连接失败 · 请刷新', true);
  } finally {
    quoteRequestPending = false;
    document.getElementById('refresh-btn').disabled = false;
    if (quoteRefreshQueued) { quoteRefreshQueued = false; fetchAndRender(); }
  }
}
function startAutoRefresh() { clearInterval(refreshTimer); refreshTimer = document.hidden ? null : setInterval(fetchAndRender, refreshIntervalMs); }
function setRefreshInterval(value) { const interval = Number(value); if (!REFRESH_INTERVAL_OPTIONS.includes(interval)) return; refreshIntervalMs = interval; localStorage.setItem(REFRESH_INTERVAL_STORAGE_KEY, String(interval)); document.getElementById('refresh-interval').value = String(interval); startAutoRefresh(); fetchAndRender(); }
function setSortMode(mode) { if (!['order','pct'].includes(mode)) return; sortMode = mode; localStorage.setItem(FLOAT_SORT_STORAGE_KEY, mode); document.querySelectorAll('[data-sort]').forEach(button => button.classList.toggle('active', button.dataset.sort === mode)); renderRows(latestRows); }
function manualRefresh() { fetchAndRender(); }
function openStock(symbol) { if (!validSymbol(symbol)) return; if (window.opener && !window.opener.closed) { window.opener.postMessage({ type:'stock-float-open', symbol }, location.origin); window.opener.focus(); } else { location.href = '/'; } }
function returnToMainWindow() {
  if (window.opener && !window.opener.closed) {
    try { window.opener.focus(); } catch (_) {}
    try { window.close(); } catch (_) {}
    return;
  }
  location.href = '/';
}
window.addEventListener('storage', event => { if (event.key === THEME_STORAGE_KEY) { themePreference = THEME_PREFERENCES.includes(event.newValue) ? event.newValue : 'dark'; applyTheme(); return; } if (event.key === COLOR_STORAGE_KEY) { showListColors = event.newValue !== 'false'; renderRows(latestRows); return; } if (event.key === REFRESH_INTERVAL_STORAGE_KEY) { const interval = Number(event.newValue); if (REFRESH_INTERVAL_OPTIONS.includes(interval)) { refreshIntervalMs = interval; document.getElementById('refresh-interval').value = String(interval); startAutoRefresh(); } return; } if ([GROUPS_STORAGE_KEY, ACTIVE_GROUP_STORAGE_KEY, STORAGE_KEY].includes(event.key)) fetchAndRender(); });
systemThemeQuery.addEventListener?.('change', () => { if (themePreference === 'system') applyTheme(); });
document.addEventListener('visibilitychange', () => { startAutoRefresh(); if (!document.hidden) fetchAndRender(); });
window.addEventListener('beforeunload', () => clearInterval(refreshTimer));
applyTheme();
document.getElementById('refresh-interval').value = String(refreshIntervalMs);
setSortMode(sortMode);
fetchAndRender();
startAutoRefresh();
</script>
</body>
</html>
